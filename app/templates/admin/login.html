<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #F2E8DC;
            background-image:
                radial-gradient(circle at 12% 8%, rgba(198, 169, 146, 0.25), transparent 45%),
                radial-gradient(circle at 88% 2%, rgba(62, 35, 16, 0.06), transparent 40%);
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center px-4">
    <div class="bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-[0_20px_50px_-16px_rgba(62,35,16,0.2)] w-full max-w-sm border border-[#E0CCB7]/30">
        <div class="text-center mb-6">
            <h1 class="text-xl font-extrabold text-[#3E2310] tracking-tight">UNICOM</h1>
            <p class="text-xs text-[#8C735F] font-medium mt-1">Панель управления</p>
        </div>

        <h2 class="text-lg font-bold mb-5 text-center text-[#3E2310]">Вход для сотрудников</h2>
        
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl mb-4 text-sm font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ next_url or '/admin' }}">
            <div class="mb-4">
                <label class="block text-[#8C735F] text-xs font-bold uppercase tracking-wider mb-1.5">Логин</label>
                <input name="username" type="text" class="w-full bg-[#FCF9F5] border border-[#E0CCB7]/50 rounded-xl py-2.5 px-4 text-[#3E2310] text-sm font-medium focus:outline-none focus:border-[#6B3F1E] focus:ring-2 focus:ring-[#6B3F1E]/10 transition" required>
            </div>
            <div class="mb-6">
                <label class="block text-[#8C735F] text-xs font-bold uppercase tracking-wider mb-1.5">Пароль</label>
                <input name="password" type="password" class="w-full bg-[#FCF9F5] border border-[#E0CCB7]/50 rounded-xl py-2.5 px-4 text-[#3E2310] text-sm font-medium focus:outline-none focus:border-[#6B3F1E] focus:ring-2 focus:ring-[#6B3F1E]/10 transition" required>
            </div>
            <button class="w-full bg-[#3E2310] hover:bg-[#2A180B] text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-[#3E2310]/20">
                <i class="fas fa-sign-in-alt mr-2 text-sm"></i> Войти
            </button>
        </form>
    </div>
</body>
</html>
