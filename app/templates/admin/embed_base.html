<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админ-панель{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --admin-bg: #F2E8DC;
            --admin-surface: #FCF9F5;
            --admin-ink: #3E2310;
            --admin-muted: #8C735F;
            --admin-accent: #6B3F1E;
            --admin-border: rgba(224, 204, 183, 0.4);
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: transparent;
            color: var(--admin-ink);
            -webkit-font-smoothing: antialiased;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--admin-border);
            border-radius: 1.25rem;
            box-shadow: 0 8px 32px -8px rgba(62, 35, 16, 0.1);
        }

        .admin-input {
            background: var(--admin-surface);
            border: 1.5px solid var(--admin-border);
            border-radius: 0.75rem;
            padding: 0.5rem 0.875rem;
            font-size: 0.875rem;
            color: var(--admin-ink);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .admin-input:focus {
            outline: none;
            border-color: var(--admin-accent);
            box-shadow: 0 0 0 3px rgba(107, 63, 30, 0.08);
        }

        .admin-btn {
            background: var(--admin-ink);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            border: none;
            transition: background 0.2s;
            cursor: pointer;
        }

        .admin-btn:hover {
            background: #2A180B;
        }

        .admin-btn-accent {
            background: var(--admin-accent);
            color: #fff;
            font-weight: 700;
            font-size: 0.875rem;
            padding: 0.625rem 1.25rem;
            border-radius: 0.75rem;
            border: none;
            box-shadow: 0 6px 20px -4px rgba(107, 63, 30, 0.25);
            transition: background 0.2s;
            cursor: pointer;
        }

        .admin-btn-accent:hover {
            background: #543116;
        }
    </style>
</head>

<body class="leading-normal tracking-normal">
    <div class="min-w-0">
        {% block content %}{% endblock %}
    </div>
    <script src="/static/js/admin_image_cropper.js?v=1"></script>
</body>

</html>
